<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Table — Little Lemon</title>
  <meta name="description" content="Book a table at Little Lemon.">
  <meta name="author" content="Lazuardi Al-Muzaki">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; background-color: #f9f9f9; }
    a { text-decoration: none; color: inherit; }

    header { background: #ffffff; border-bottom: 1px solid #dddddd; padding: 15px 5%; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
    .brand-logo { font-size: 1.8rem; font-weight: bold; color: #495E57; }
    .nav-links { display: flex; list-style: none; gap: 20px; }
    .nav-links a { font-weight: bold; font-size: 0.9rem; color: #555; }
    .nav-links a.active { color: #EE99C2; }

    .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    
    .card { background: white; padding: 30px; border-radius: 8px; border: 1px solid #ddd; }
    h1 { margin-bottom: 20px; color: #495E57; font-size: 1.8rem; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    
    button { background: #495E57; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #3b4d47; }

    footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 60px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand-logo">Little Lemon</div>
      <ul class="nav-links">
        <li><a href="index.html">Menu</a></li>
        <li><a href="book.html" class="active">Book a Table</a></li>
        <li><a href="location.html">Location & Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Book a Table</h1>
      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="date">Tanggal</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
          <label for="guests">Jumlah Tamu</label>
          <select id="guests" name="guests">
            <option>1 Orang</option>
            <option selected>2 Orang</option>
            <option>4 Orang</option>
            <option>6+ Orang</option>
          </select>
        </div>
        <div class="form-group">
          <label for="notes">Catatan Khusus</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>
        <button type="submit">Konfirmasi Reservasi</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Little Lemon. All rights reserved.</p>
  </footer>

</body>
</html>
