<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Lemon — Restaurant & Bar</title>
  <meta name="description" content="Middle Eastern food in the Main District.">
  <meta name="author" content="Lazuardi Al-Muzaki">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; background-color: #f9f9f9; }
    a { text-decoration: none; color: inherit; }

    /* Header & Nav */
    header { background: #ffffff; border-bottom: 1px solid #dddddd; padding: 15px 5%; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
    .brand-logo { font-size: 1.8rem; font-weight: bold; color: #495E57; }
    .nav-links { display: flex; list-style: none; gap: 20px; }
    .nav-links a { font-weight: bold; font-size: 0.9rem; color: #555; }
    .nav-links a:hover, .nav-links a.active { color: #EE99C2; }

    /* Main Container */
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

    /* Banner */
    .hero { background: #495E57; color: white; padding: 40px; border-radius: 8px; text-align: center; margin-bottom: 30px; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .hero p { font-size: 1.1rem; color: #EDEFEE; }

    /* Menu Section */
    .section-title { font-size: 1.5rem; margin-bottom: 20px; color: #333; border-bottom: 2px solid #495E57; padding-bottom: 5px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .menu-item { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; display: flex; align-items: center; padding: 15px; gap: 15px; }
    .menu-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
    .menu-item h3 { font-size: 1.1rem; margin-bottom: 5px; }
    .menu-item p { font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .menu-item .price { font-weight: bold; color: #495E57; }

    /* Footer */
    footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 40px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand-logo">Little Lemon</div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Menu</a></li>
        <li><a href="book.html">Book a Table</a></li>
        <li><a href="location.html">Location & Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Little Lemon</h1>
      <p>Middle Eastern Food in Main District</p>
    </section>

    <h2 class="section-title">Our Menu</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <img src="falafel.jpeg" alt="Falafel" onerror="this.src='https://via.placeholder.com/80'">
        <div>
          <h3>Falafel</h3>
          <p>Chickpea, herbs, and spices</p>
          <div class="price">$10</div>
        </div>
      </div>
      <div class="menu-item">
        <img src="salad.jpeg" alt="Pasta Salad" onerror="this.src='https://via.placeholder.com/80'">
        <div>
          <h3>Pasta Salad</h3>
          <p>Lettuce, vegetables, and mozzarella</p>
          <div class="price">$12</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Little Lemon. All rights reserved.</p>
  </footer>

</body>
</html>
